name: open-claimidx-mint-pr
on:
  push:
    branches: [main]
    paths: ['.github/workflows/open-claimidx-mint-pr.yml']
  workflow_dispatch:
jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create PR against upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Summary
          Updates the **existing** claimidx listings (Coding Agents + Knowledge & Memory) to the mint-first countable path. No new entry is added — claimidx is already listed twice on main.

          ## Why
          Previous blurbs emphasized ask/ingest. Ask alone does not put a DID on the commons. Countable path:

          1. pip install "claimidx[server]"
          2. claimidx init --agent <name> (wires DID/MCP)
          3. claimidx claim --yes (mints)

          MCP: claimidx-mcp.

          ## Changes
          - Coding Agents: keep Glama badge; mint-first wording
          - Knowledge & Memory: mint-path blurb (ask alone does not)

          Exactly two bullets changed.
          EOF
          # strip leading indent from heredoc lines
          sed -i 's/^          //' "$BODY_FILE"
          gh api \
            --method POST \
            repos/punkpeye/awesome-mcp-servers/pulls \
            -f title='Update claimidx listing to init→claim mint path' \
            -f head='AhmiDarrow:docs/claimidx-mint-path-v2' \
            -f base='main' \
            -F body=@$BODY_FILE \
            -F maintainer_can_modify=true \
            --jq .html_url
